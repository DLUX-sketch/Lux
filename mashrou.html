<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>إدارة المشروع</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#0F3D3E; --ink-2:#0B2C2D;
  --gold:#E2A73E; --gold-2:#C98A22;
  --base:#F7F5F0; --card:#FFFFFF;
  --text:#1A1F1E; --muted:#5C6B69;
  --ok:#2F9E5B; --danger:#C4453A; --warn:#D68A2B;
  --border:#E4E0D6;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ink:#123F3E; --base:#12181A; --card:#1B2325; --text:#EDEFEE; --muted:#9AA6A4; --border:#2A3436;
  }
}
:root[data-theme="dark"]{
  --ink:#123F3E; --base:#12181A; --card:#1B2325; --text:#EDEFEE; --muted:#9AA6A4; --border:#2A3436;
}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
body{margin:0; height:100%; background:var(--base); color:var(--text); font-family:'Tajawal',system-ui,sans-serif; font-weight:400; -webkit-font-smoothing:antialiased}
header{background:linear-gradient(135deg,var(--ink),var(--ink-2)); color:#fff; padding:22px 18px 18px; padding-top:calc(22px + env(safe-area-inset-top,0px))}
header h1{margin:0; font-size:22px; font-weight:900}
header p{margin:4px 0 0; color:#CFE3E0; font-size:13px}
nav{display:flex; gap:6px; padding:10px 12px; background:var(--card); border-bottom:1px solid var(--border); position:sticky; top:0; z-index:10; overflow-x:auto}
nav button{flex:0 0 auto; min-width:70px; border:none; background:transparent; color:var(--muted); font-family:inherit; font-size:12.5px; font-weight:700; padding:9px 10px; border-radius:10px; cursor:pointer; transition:background .15s, color .15s; white-space:nowrap}
nav button.active{background:var(--gold); color:#2A1E06}
main{padding:16px; max-width:640px; margin:0 auto; padding-bottom:60px}
.card{background:var(--card); border:1px solid var(--border); border-radius:14px; padding:16px; margin-bottom:14px}
.stats{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:14px}
.stat{background:var(--card); border:1px solid var(--border); border-radius:14px; padding:14px}
.stat .n{font-size:20px; font-weight:900; color:var(--ink)}
@media (prefers-color-scheme:dark){.stat .n{color:#7FD4CE}}
:root[data-theme="dark"] .stat .n{color:#7FD4CE}
.stat .n.bad{color:var(--danger)}
.stat .l{font-size:12px; color:var(--muted); margin-top:2px}
.head-row{display:flex; justify-content:space-between; align-items:center; margin-bottom:12px}
h2{font-size:16px; font-weight:700; margin:0}
p.lead{font-size:14px; line-height:1.9; color:var(--text); margin:0 0 4px}
.linkbtn{background:none; border:none; color:var(--ink); font-family:inherit; font-weight:700; font-size:12.5px; cursor:pointer; padding:6px 8px; border-radius:8px}
@media (prefers-color-scheme:dark){.linkbtn{color:#7FD4CE}}
:root[data-theme="dark"] .linkbtn{color:#7FD4CE}
.search{width:100%; margin-bottom:10px; padding:10px 12px; border-radius:10px; border:1px solid var(--border); background:var(--base); color:var(--text); font-family:inherit; font-size:14px}
.row{display:flex; justify-content:space-between; align-items:center; padding:11px 0; border-bottom:1px solid var(--border); gap:8px}
.row:last-child{border-bottom:none}
.row .main{font-weight:700; font-size:14.5px}
.row .sub{font-size:12.5px; color:var(--muted); margin-top:2px}
.badge{font-size:11.5px; font-weight:700; padding:4px 9px; border-radius:20px; white-space:nowrap}
.badge.pending{background:#FCEBD0; color:#8A5A0F}
.badge.shipped{background:#D9E8F5; color:#2A5D8A}
.badge.done{background:#DAF0E1; color:#1F7A45}
:root[data-theme="dark"] .badge.pending{background:#3A2E12;color:#E6B863}
:root[data-theme="dark"] .badge.shipped{background:#16283A;color:#8FC0EE}
:root[data-theme="dark"] .badge.done{background:#123321;color:#7FD9A0}
.lowstock{color:var(--danger); font-weight:700}
.debt{color:var(--danger); font-weight:700}
form{display:flex; flex-direction:column; gap:10px}
label{font-size:12.5px; color:var(--muted); font-weight:700; margin-bottom:-4px}
input,select,textarea{font-family:inherit; font-size:14.5px; padding:11px 12px; border-radius:10px; border:1px solid var(--border); background:var(--base); color:var(--text); width:100%}
textarea{resize:vertical; min-height:50px}
.btn{border:none; border-radius:10px; padding:12px; font-family:inherit; font-weight:700; font-size:14.5px; cursor:pointer; background:var(--gold); color:#2A1E06}
.btn:active{background:var(--gold-2)}
.btn.secondary{background:var(--base); color:var(--text); border:1px solid var(--border)}
.btn.danger{background:#FBE7E5; color:var(--danger)}
.btn.small{padding:7px 12px; font-size:12.5px; flex:0 0 auto}
.btn.wa{background:var(--ok); color:#fff; text-decoration:none; display:inline-block; text-align:center}
.fab{position:fixed; bottom:calc(18px + env(safe-area-inset-bottom,0px)); left:18px; width:52px; height:52px; border-radius:50%; background:var(--ink); color:#fff; font-size:26px; border:none; box-shadow:0 6px 18px rgba(0,0,0,.25); cursor:pointer; z-index:20}
.empty{text-align:center; padding:30px 10px; color:var(--muted); font-size:13.5px}
.modal-bg{position:fixed; inset:0; background:rgba(0,0,0,.45); display:flex; align-items:flex-end; z-index:50}
.modal{background:var(--card); width:100%; max-height:88vh; overflow-y:auto; border-radius:18px 18px 0 0; padding:18px 16px calc(20px + env(safe-area-inset-bottom,0px)); animation:up .2s ease-out}
@keyframes up{from{transform:translateY(30px);opacity:0}to{transform:translateY(0);opacity:1}}
.modal h3{margin:0 0 14px; font-size:17px; font-weight:900}
.rowbtns{display:flex; gap:8px; margin-top:6px}
.rowbtns .btn{flex:1}
.pill-group{display:flex; gap:6px; flex-wrap:wrap}
.pill{padding:7px 12px; border-radius:20px; border:1px solid var(--border); background:var(--base); font-size:13px; font-weight:700; cursor:pointer; color:var(--text)}
.pill.sel{background:var(--ink); color:#fff; border-color:var(--ink)}
.steps{display:flex; flex-direction:column; gap:10px}
.step{display:flex; gap:12px; align-items:flex-start}
.step .num{flex:0 0 28px; height:28px; border-radius:50%; background:var(--ink); color:#fff; display:flex; align-items:center; justify-content:center; font-weight:900; font-size:13px}
.step .txt{font-size:14px; line-height:1.7; padding-top:3px}
.step .txt b{display:block; font-weight:700; margin-bottom:2px}
.reqlist{margin:0; padding-right:18px; font-size:14px; line-height:2}
.commission-box{display:flex; justify-content:space-between; align-items:center; background:var(--base); border:1px dashed var(--border); border-radius:12px; padding:14px}
.commission-box .amt{font-size:22px; font-weight:900; color:var(--ink)}
@media (prefers-color-scheme:dark){.commission-box .amt{color:#7FD4CE}}
:root[data-theme="dark"] .commission-box .amt{color:#7FD4CE}
</style>
</head>
<body>
<header>
  <h1>مشروعي</h1>
  <p id="subtitle">وسيط توزيع محلي — تسويق بدون مخزون</p>
</header>
<nav id="nav">
  <button data-tab="merchants" class="active">للتجار</button>
  <button data-tab="dash">الرئيسية</button>
  <button data-tab="products">المخزون</button>
  <button data-tab="orders">الطلبات</button>
  <button data-tab="customers">الزبائن</button>
  <button data-tab="debts">الديون</button>
  <button data-tab="expenses">المصاريف</button>
</nav>
<main id="main"></main>
<button class="fab" id="fab">+</button>

<script>
let db = null, downloadsCap = null;
let state = { products: {}, orders: {}, customers: {}, expenses: {}, merchantLeads: {}, settings:{commissionPerCustomer:5000, whatsapp:'+964 66 701 5977'} };
let currentTab = 'merchants';
let search = { orders:'', customers:'' };

(async function boot(){
  try{ db = await claude.use('db'); }catch(e){ db = null; }
  try{ downloadsCap = await claude.use('downloads'); }catch(e){ downloadsCap = null; }
  await loadAll();
  render();
  if(db) subscribeAll();
})();

async function loadAll(){
  if(!db){ loadLocal(); return; }
  try{
    const [p,o,c,ex,ml,st] = await Promise.all([
      db.collection('products').get(), db.collection('orders').get(),
      db.collection('customers').get(), db.collection('expenses').get(),
      db.collection('merchantLeads').get(), db.collection('settings').get()
    ]);
    p.forEach(d=> state.products[d.id]=d.data);
    o.forEach(d=> state.orders[d.id]=d.data);
    c.forEach(d=> state.customers[d.id]=d.data);
    ex.forEach(d=> state.expenses[d.id]=d.data);
    ml.forEach(d=> state.merchantLeads[d.id]=d.data);
    st.forEach(d=>{ if(d.id==='main') state.settings = {...state.settings, ...d.data}; });
  }catch(e){ loadLocal(); }
}
function subscribeAll(){
  try{
    db.collection('products').onSnapshot(l=>{ state.products={}; l.forEach(d=>state.products[d.id]=d.data); render(); });
    db.collection('orders').onSnapshot(l=>{ state.orders={}; l.forEach(d=>state.orders[d.id]=d.data); render(); });
    db.collection('customers').onSnapshot(l=>{ state.customers={}; l.forEach(d=>state.customers[d.id]=d.data); render(); });
    db.collection('expenses').onSnapshot(l=>{ state.expenses={}; l.forEach(d=>state.expenses[d.id]=d.data); render(); });
    db.collection('merchantLeads').onSnapshot(l=>{ state.merchantLeads={}; l.forEach(d=>state.merchantLeads[d.id]=d.data); render(); });
    db.collection('settings').onSnapshot(l=>{ l.forEach(d=>{ if(d.id==='main') state.settings={...state.settings, ...d.data}; }); render(); });
  }catch(e){}
}
function loadLocal(){ try{ const raw = localStorage.getItem('mashrou3_data'); if(raw) state = {...state, ...JSON.parse(raw)}; }catch(e){} }
function saveLocal(){ try{ localStorage.setItem('mashrou3_data', JSON.stringify(state)); }catch(e){} }
function newId(){ return 'id'+Date.now()+Math.random().toString(36).slice(2,7); }
async function writeDoc(col, id, data){
  state[col][id] = data;
  if(db){ try{ await db.collection(col).doc(id).set(data); }catch(e){ saveLocal(); alert('تعذّر الحفظ على الخادم، تم الحفظ محلياً على هذا الجهاز فقط'); } }
  else { saveLocal(); render(); }
}
async function deleteDoc(col, id){
  delete state[col][id];
  if(db){ try{ await db.collection(col).doc(id).delete(); }catch(e){ saveLocal(); alert('تعذّر الحذف على الخادم، تم التحديث محلياً فقط'); } }
  else { saveLocal(); render(); }
}
async function saveSettings(patch){
  state.settings = {...state.settings, ...patch};
  if(db){ try{ await db.collection('settings').doc('main').set(state.settings); }catch(e){ saveLocal(); alert('تعذّر الحفظ على الخادم، تم الحفظ محلياً فقط'); } }
  else { saveLocal(); render(); }
}

document.getElementById('nav').addEventListener('click', e=>{
  const b = e.target.closest('button'); if(!b) return;
  currentTab = b.dataset.tab;
  [...document.querySelectorAll('#nav button')].forEach(x=>x.classList.toggle('active', x===b));
  render();
});
document.getElementById('fab').addEventListener('click', ()=>{
  if(currentTab==='customers') openCustomerModal();
  else if(currentTab==='expenses') openExpenseModal();
  else if(currentTab==='merchants') openMerchantModal();
  else if(currentTab==='products') openProductModal();
  else if(currentTab==='debts'){ /* no add action */ }
  else openOrderModal();
});

function esc(s){ return (s||'').toString().replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function money(n){ return (Math.round((n||0)*100)/100).toLocaleString('ar-IQ'); }

function render(){
  const m = document.getElementById('main');
  document.getElementById('fab').style.display = (currentTab==='dash' || currentTab==='debts') ? 'none' : 'block';
  if(currentTab==='merchants') m.innerHTML = renderMerchants();
  else if(currentTab==='dash') m.innerHTML = renderDash();
  else if(currentTab==='products') m.innerHTML = renderProducts();
  else if(currentTab==='orders') m.innerHTML = renderOrders();
  else if(currentTab==='customers') m.innerHTML = renderCustomers();
  else if(currentTab==='debts') m.innerHTML = renderDebts();
  else if(currentTab==='expenses') m.innerHTML = renderExpenses();
  attachHandlers();
}

function orderDebt(o){ const total=(o.qty||0)*(o.priceEach||0); const paid=(o.amountPaid==null?total:o.amountPaid); return total-paid; }
function statusLabel(s){ return s==='pending'?'معلّق':s==='shipped'?'مشحون':'مكتمل'; }

function renderMerchants(){
  const wa = state.settings.whatsapp;
  const waLink = wa ? `https://wa.me/${wa.replace(/[^0-9]/g,'')}?text=${encodeURIComponent('مرحباً، شفت صفحتكم وأحب أتعاون وياكم بتوزيع منتجاتكم')}` : null;
  const leads = Object.entries(state.merchantLeads).sort((a,b)=> (b[1].date||'').localeCompare(a[1].date||''));
  return `
  <div class="card">
    <h2>شلون نتعاون سوا؟</h2>
    <p class="lead">أنا أسوّق منتجاتك لزبائن جدد بدون ما تدفع إعلانات بنفسك. أنت توفر البضاعة والتوصيل، وأنا أجيبلك الزبون — وناخذ عمولة عن كل زبون جديد نوصّله إلك، مو نسبة من كل عملية بيع.</p>
  </div>
  <div class="card">
    <h2>خطوات التعاون</h2>
    <div class="steps">
      <div class="step"><div class="num">1</div><div class="txt"><b>تواصل أولي</b>تكلمني عبر واتساب وتعطيني فكرة عن بضاعتك وأسعارك.</div></div>
      <div class="step"><div class="num">2</div><div class="txt"><b>ترسل الصور والمعلومات</b>صور واضحة للمنتجات + سعر الجملة + سعر البيع المقترح + الكمية المتوفرة.</div></div>
      <div class="step"><div class="num">3</div><div class="txt"><b>أسوّق المنتج</b>أنشر وأروّج للمنتجات على حساباتي وأتابع الرسائل والاستفسارات.</div></div>
      <div class="step"><div class="num">4</div><div class="txt"><b>تأكيد الطلب</b>لما يجيني زبون جاهز للشراء، أحولّه إلك مباشرة بمعلوماته الكاملة.</div></div>
      <div class="step"><div class="num">5</div><div class="txt"><b>تسديد العمولة</b>تدفع العمولة المتفق عليها عن هذا الزبون، بغض النظر عن حجم طلبه.</div></div>
    </div>
  </div>
  <div class="card">
    <h2>شنو تحتاج توفره</h2>
    <ul class="reqlist">
      <li>صور واضحة للمنتجات (خلفية نظيفة إن أمكن)</li>
      <li>سعر الجملة وسعر البيع المقترح لكل منتج</li>
      <li>الكمية المتوفرة حالياً وحالة التوفر المستمر</li>
      <li>رقم واتساب للرد السريع على الزبائن</li>
      <li>وضوح بسياسة التوصيل والاستبدال/الإرجاع</li>
    </ul>
  </div>
  <div class="card">
    <div class="head-row"><h2>العمولة عن كل زبون</h2><button class="linkbtn" id="editCommission">تعديل</button></div>
    <div class="commission-box"><div class="amt">${money(state.settings.commissionPerCustomer)} د.ع</div><div class="sub" style="color:var(--muted); font-size:12.5px">لكل زبون جديد، وليس نسبة من البيع</div></div>
  </div>
  <div class="card">
    <h2>تواصل معي</h2>
    ${waLink ? `<a class="btn wa" href="${waLink}" target="_blank">تواصل عبر واتساب</a><button class="linkbtn" id="setWa" style="margin-top:4px">تعديل الرقم</button>` : `<button class="btn secondary" id="setWa">أضف رقم واتساب للتواصل</button>`}
  </div>
  <div class="card">
    <div class="head-row"><h2>تجار تواصلوا (${leads.length})</h2></div>
    ${leads.length ? leads.map(([id,l])=>`
      <div class="row" data-merchant="${id}">
        <div><div class="main">${esc(l.name)}</div><div class="sub">${esc(l.category||'')} · ${esc(l.phone||'')}</div></div>
      </div>`).join('') : `<div class="empty">ما فيه تجار مسجلين بعد — أضف من زر +</div>`}
  </div>`;
}

function renderProducts(){
  const prods = Object.entries(state.products).sort((a,b)=>a[1].name.localeCompare(b[1].name,'ar'));
  return `<div class="card">
    <div class="head-row"><h2>المخزون (${prods.length})</h2></div>
    ${prods.length ? prods.map(([id,p])=>`
      <div class="row" data-product="${id}">
        <div><div class="main">${esc(p.name)}</div><div class="sub ${(p.qty||0)<=5?'lowstock':''}">الكمية: ${p.qty||0} · بيع ${money(p.price)} · تكلفة ${money(p.cost)}</div></div>
      </div>`).join('') : `<div class="empty">أضف أول منتج من زر +</div>`}
  </div>`;
}

function renderDash(){
  const prods = Object.entries(state.products);
  const ords = Object.entries(state.orders);
  const exps = Object.values(state.expenses);
  const revenue = ords.reduce((s,[,o])=> s + (o.qty||0)*(o.priceEach||0), 0);
  const grossProfit = ords.reduce((s,[,o])=> s + (o.qty||0)*((o.priceEach||0)-(o.costEach||0)), 0);
  const totalExpenses = exps.reduce((s,e)=> s+(e.amount||0), 0);
  const netProfit = grossProfit - totalExpenses;
  const pending = ords.filter(([,o])=>o.status==='pending').length;
  const totalDebt = ords.reduce((s,[,o])=> s + Math.max(0,orderDebt(o)), 0);
  const merchantCount = Object.keys(state.merchantLeads).length;
  const recentOrders = ords.sort((a,b)=> (b[1].date||'').localeCompare(a[1].date||'')).slice(0,5);
  return `
  <div class="stats">
    <div class="stat"><div class="n">${money(revenue)}</div><div class="l">إجمالي المبيعات</div></div>
    <div class="stat"><div class="n">${money(netProfit)}</div><div class="l">صافي الربح (بعد المصاريف)</div></div>
    <div class="stat"><div class="n">${merchantCount}</div><div class="l">تجار متعاونين</div></div>
    <div class="stat"><div class="n ${totalDebt>0?'bad':''}">${money(totalDebt)}</div><div class="l">ديون على الزبائن</div></div>
    <div class="stat"><div class="n">${pending}</div><div class="l">طلبات معلّقة</div></div>
    <div class="stat"><div class="n">${money(totalExpenses)}</div><div class="l">إجمالي المصاريف</div></div>
  </div>
  <div class="card">
    <h2>آخر الطلبات</h2>
    ${recentOrders.length ? recentOrders.map(([id,o])=>`
      <div class="row" data-order="${id}">
        <div><div class="main">${esc(o.customerName)}</div><div class="sub">${esc(o.productName)} × ${o.qty}</div></div>
        <span class="badge ${o.status}">${statusLabel(o.status)}</span>
      </div>`).join('') : `<div class="empty">لا توجد طلبات بعد</div>`}
  </div>`;
}

function renderOrders(){
  const ords = Object.entries(state.orders).filter(([,o])=>o.customerName.toLowerCase().includes(search.orders.toLowerCase())||o.productName.toLowerCase().includes(search.orders.toLowerCase())).sort((a,b)=> (b[1].date||'').localeCompare(a[1].date||''));
  return `<div class="card">
    <div class="head-row"><h2>الطلبات (${ords.length})</h2><button class="linkbtn" id="expOrders">تصدير CSV</button></div>
    <input class="search" placeholder="بحث بالزبون أو المنتج..." id="searchOrders" value="${esc(search.orders)}">
    ${ords.length ? ords.map(([id,o])=>`
      <div class="row" data-order="${id}">
        <div><div class="main">${esc(o.customerName)}</div>
          <div class="sub">${esc(o.productName)} × ${o.qty} — ${money(o.qty*o.priceEach)} · ${o.date||''}${orderDebt(o)>0?` · <span class="debt">دين ${money(orderDebt(o))}</span>`:''}</div>
        </div>
        <span class="badge ${o.status}">${statusLabel(o.status)}</span>
      </div>`).join('') : `<div class="empty">لا توجد طلبات بعد، أضف طلب من زر +</div>`}
  </div>`;
}

function renderCustomers(){
  const custs = Object.entries(state.customers).filter(([,c])=>c.name.toLowerCase().includes(search.customers.toLowerCase())).sort((a,b)=>a[1].name.localeCompare(b[1].name,'ar'));
  const ordsByCustomer = {};
  Object.values(state.orders).forEach(o=>{ ordsByCustomer[o.customerName]=(ordsByCustomer[o.customerName]||0)+1; });
  return `<div class="card">
    <div class="head-row"><h2>الزبائن (${custs.length})</h2><button class="linkbtn" id="expCust">تصدير CSV</button></div>
    <input class="search" placeholder="بحث عن زبون..." id="searchCust" value="${esc(search.customers)}">
    ${custs.length ? custs.map(([id,c])=>`
      <div class="row" data-customer="${id}">
        <div><div class="main">${esc(c.name)}</div><div class="sub">${esc(c.phone||'')} · ${ordsByCustomer[c.name]||0} طلب</div></div>
      </div>`).join('') : `<div class="empty">أضف أول زبون من زر +</div>`}
  </div>`;
}

function renderDebts(){
  const debts = Object.entries(state.orders).map(([id,o])=>[id,o,orderDebt(o)]).filter(([,,d])=>d>0).sort((a,b)=>b[2]-a[2]);
  const total = debts.reduce((s,[,,d])=>s+d,0);
  return `<div class="card">
    <div class="head-row"><h2>الديون (${debts.length})</h2><div class="main debt">${money(total)}</div></div>
    ${debts.length ? debts.map(([id,o,d])=>`
      <div class="row">
        <div><div class="main">${esc(o.customerName)}</div><div class="sub">${esc(o.productName)} · ${o.date||''}</div></div>
        <div style="display:flex; align-items:center; gap:8px"><span class="debt">${money(d)}</span><button class="btn small" data-paydebt="${id}">تسديد</button></div>
      </div>`).join('') : `<div class="empty">لا توجد ديون حالياً 🎉</div>`}
  </div>`;
}

function renderExpenses(){
  const exps = Object.entries(state.expenses).sort((a,b)=> (b[1].date||'').localeCompare(a[1].date||''));
  const total = exps.reduce((s,[,e])=>s+(e.amount||0),0);
  return `<div class="card">
    <div class="head-row"><h2>المصاريف (${exps.length})</h2><div class="main">${money(total)}</div></div>
    ${exps.length ? exps.map(([id,e])=>`
      <div class="row" data-expense="${id}">
        <div><div class="main">${esc(e.desc)}</div><div class="sub">${esc(e.category||'')} · ${e.date||''}</div></div>
        <div class="main">${money(e.amount)}</div>
      </div>`).join('') : `<div class="empty">أضف أول مصروف من زر +</div>`}
  </div>`;
}

function attachHandlers(){
  document.querySelectorAll('[data-order]').forEach(el=> el.onclick=()=> openOrderModal(el.dataset.order));
  document.querySelectorAll('[data-customer]').forEach(el=> el.onclick=()=> openCustomerModal(el.dataset.customer));
  document.querySelectorAll('[data-expense]').forEach(el=> el.onclick=()=> openExpenseModal(el.dataset.expense));
  document.querySelectorAll('[data-merchant]').forEach(el=> el.onclick=()=> openMerchantModal(el.dataset.merchant));
  document.querySelectorAll('[data-product]').forEach(el=> el.onclick=()=> openProductModal(el.dataset.product));
  document.querySelectorAll('[data-paydebt]').forEach(el=> el.onclick=async e=>{
    e.stopPropagation(); const id = el.dataset.paydebt; const o = state.orders[id];
    await writeDoc('orders', id, {...o, amountPaid:(o.qty||0)*(o.priceEach||0)}); render();
  });
  const so = document.getElementById('searchOrders'); if(so) so.oninput = e=>{ search.orders=e.target.value; render(); const x=document.getElementById('searchOrders'); x.focus(); x.selectionStart=x.value.length; };
  const sc = document.getElementById('searchCust'); if(sc) sc.oninput = e=>{ search.customers=e.target.value; render(); const x=document.getElementById('searchCust'); x.focus(); x.selectionStart=x.value.length; };
  const eo = document.getElementById('expOrders'); if(eo) eo.onclick = ()=> exportCSV('الطلبات.csv', ['الزبون','المنتج','الكمية','السعر','الحالة','التاريخ','الدين'], Object.values(state.orders).map(o=>[o.customerName,o.productName,o.qty,o.priceEach,statusLabel(o.status),o.date,orderDebt(o)]));
  const ec = document.getElementById('expCust'); if(ec) ec.onclick = ()=> exportCSV('الزبائن.csv', ['الاسم','الهاتف','العنوان'], Object.values(state.customers).map(c=>[c.name,c.phone,c.address]));
  const edC = document.getElementById('editCommission'); if(edC) edC.onclick = ()=>{
    const v = prompt('قيمة العمولة عن كل زبون (د.ع):', state.settings.commissionPerCustomer);
    if(v!==null && !isNaN(+v)) saveSettings({commissionPerCustomer:+v});
  };
  const setWa = document.getElementById('setWa'); if(setWa) setWa.onclick = ()=>{
    const v = prompt('رقم الواتساب (مع كود الدولة، مثال 9647xxxxxxxx):', state.settings.whatsapp||'');
    if(v) saveSettings({whatsapp:v.trim()});
  };
}

async function exportCSV(filename, headers, rows){
  const csv = '\uFEFF'+[headers, ...rows].map(r=>r.map(v=>`"${(v??'').toString().replace(/"/g,'""')}"`).join(',')).join('\r\n');
  if(downloadsCap){ try{ await downloadsCap.save({filename, data:csv}); return; }catch(e){} }
  try{
    const blob = new Blob([csv], {type:'text/csv;charset=utf-8;'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a'); a.href=url; a.download=filename;
    document.body.appendChild(a); a.click(); a.remove(); URL.revokeObjectURL(url);
  }catch(e){ alert('تعذّر التصدير على هذا المتصفح'); }
}

function openModal(html){
  const bg = document.createElement('div'); bg.className='modal-bg';
  bg.innerHTML = `<div class="modal">${html}</div>`;
  bg.addEventListener('click', e=>{ if(e.target===bg) bg.remove(); });
  document.body.appendChild(bg); return bg;
}

function openOrderModal(id){
  const o = id ? state.orders[id] : {customerName:'',phone:'',productId:'',qty:1,status:'pending',date:new Date().toISOString().slice(0,10),notes:''};
  const total = id ? (o.qty*o.priceEach) : 0;
  const paidDefault = id ? (o.amountPaid==null?total:o.amountPaid) : null;
  const prodOptions = Object.entries(state.products).map(([pid,p])=> `<option value="${pid}" ${o.productId===pid?'selected':''}>${esc(p.name)} (متوفر ${p.qty})</option>`).join('');
  const bg = openModal(`
    <h3>${id?'تعديل طلب':'طلب جديد'}</h3>
    <form id="oform">
      <label>اسم الزبون</label><input required name="customerName" value="${esc(o.customerName)}" list="custList">
      <datalist id="custList">${Object.values(state.customers).map(c=>`<option value="${esc(c.name)}">`).join('')}</datalist>
      <label>رقم الهاتف</label><input name="phone" value="${esc(o.phone||'')}">
      <label>المنتج</label><select required name="productId">${prodOptions || '<option value="">لا يوجد منتجات — أضف من تبويب المخزون إن وجد</option>'}</select>
      <label>الكمية</label><input required type="number" min="1" name="qty" value="${o.qty}">
      <label>الحالة</label>
      <div class="pill-group" id="statusPills">
        <div class="pill ${o.status==='pending'?'sel':''}" data-v="pending">معلّق</div>
        <div class="pill ${o.status==='shipped'?'sel':''}" data-v="shipped">مشحون</div>
        <div class="pill ${o.status==='done'?'sel':''}" data-v="done">مكتمل</div>
      </div>
      <label>حالة الدفع</label>
      <div class="pill-group" id="payPills">
        <div class="pill ${(!id||paidDefault>=total)?'sel':''}" data-v="full">مدفوع بالكامل</div>
        <div class="pill ${(id&&paidDefault>0&&paidDefault<total)?'sel':''}" data-v="partial">دفع جزئي</div>
        <div class="pill ${(id&&paidDefault<=0)?'sel':''}" data-v="none">دين كامل</div>
      </div>
      <div id="partialWrap" style="display:none">
        <label>المبلغ المدفوع</label><input type="number" step="any" id="amountPaidInput" value="${paidDefault||''}">
      </div>
      <label>التاريخ</label><input type="date" name="date" value="${o.date}">
      <label>ملاحظات</label><textarea name="notes">${esc(o.notes||'')}</textarea>
      <div class="rowbtns"><button type="submit" class="btn">حفظ</button>${id?'<button type="button" class="btn danger" id="delBtn">حذف</button>':''}</div>
    </form>`);
  let status = o.status;
  let payMode = (!id||paidDefault>=total) ? 'full' : (paidDefault>0?'partial':'none');
  function syncPay(){
    bg.querySelectorAll('#payPills .pill').forEach(x=>x.classList.toggle('sel', x.dataset.v===payMode));
    bg.querySelector('#partialWrap').style.display = payMode==='partial' ? 'block' : 'none';
  }
  syncPay();
  bg.querySelectorAll('#statusPills .pill').forEach(p=> p.onclick=()=>{ status = p.dataset.v; bg.querySelectorAll('#statusPills .pill').forEach(x=>x.classList.toggle('sel', x===p)); });
  bg.querySelectorAll('#payPills .pill').forEach(p=> p.onclick=()=>{ payMode = p.dataset.v; syncPay(); });
  bg.querySelector('#oform').addEventListener('submit', async e=>{
    e.preventDefault(); const f = new FormData(e.target);
    const prod = state.products[f.get('productId')];
    if(!prod){ alert('ما فيه منتج محدد لهذا الطلب'); return; }
    const custName = f.get('customerName').trim();
    const exists = Object.values(state.customers).some(c=>c.name===custName);
    if(!exists){ await writeDoc('customers', newId(), {name:custName, phone:f.get('phone')||'', address:'', notes:''}); }
    const qty = +f.get('qty'); const newTotal = qty*prod.price;
    let amountPaid = newTotal;
    if(payMode==='none') amountPaid = 0;
    else if(payMode==='partial') amountPaid = +document.getElementById('amountPaidInput').value || 0;
    const data = { customerName: custName, phone:f.get('phone')||'', productId:f.get('productId'), productName:prod.name, qty, priceEach:prod.price, costEach:prod.cost, status, amountPaid, date:f.get('date'), notes:f.get('notes')||'' };
    await writeDoc('orders', id||newId(), data); bg.remove(); render();
  });
  if(id) bg.querySelector('#delBtn').onclick = async ()=>{ if(confirm('حذف هذا الطلب؟')){ await deleteDoc('orders', id); bg.remove(); render(); } };
}
